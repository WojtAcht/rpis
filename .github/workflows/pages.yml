name: Build and deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live, pandoc and PyYAML
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-recommended texlive-latex-extra \
            texlive-lang-polish texlive-pictures texlive-fonts-recommended cm-super \
            python3-yaml
          wget -q https://github.com/jgm/pandoc/releases/download/3.2.1/pandoc-3.2.1-1-amd64.deb
          sudo dpkg -i pandoc-3.2.1-1-amd64.deb
      - name: Build PDFs and site
        run: python3 scripts/build.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regression tests
        run: |
          python3 -m unittest discover -s tests
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
