# Od czego zacząć ML: strona ml/ dla studentów, którzy pytają, od czego zacząć.
#
# `sciezki`: sekcje jedna pod drugą (id, nazwa, materialy; opcjonalnie opis). Każdy materiał to kafelek
# z polami tytul, autor, link, opis; kolejność na liście = kolejność na stronie.
# `na_agh`: koła naukowe (nazwa, opis, link; opcjonalnie link_tekst, punkty).
# Na stronie najpierw są koła naukowe, potem ścieżki w kolejności z pliku.
# Zaproszenia na Discorda wygasają, więc używaj zaproszeń bez daty ważności.

aktualizacja: listopad 2026

sciezki:
  - id: ml
    nazwa: ML
    opis: Jak i dlaczego działają sieci neuronowe.
    materialy:
      - tytul: Kaggle Learn
        autor: Kaggle
        link: https://www.kaggle.com/learn
        opis: Krótkie kursy w przeglądarce, bez instalowania niczego, m.in. Python, pandas i wprowadzenie do ML.
      - tytul: Neural Networks
        autor: 3Blue1Brown
        link: https://www.3blue1brown.com/topics/neural-networks
        opis: Wizualne wprowadzenie do sieci neuronowych i transformerów.
      - tytul: "Stanford CS229: Machine Learning"
        autor: Andrew Ng · Stanford, 2018
        link: https://www.youtube.com/watch?v=jGwO_UgTS7I&list=PLoROMvodv4rMiGQp3WXShtMGgzqpfVfbU
        opis: Klasyczny kurs ML z matematyką, od regresji i klasyfikacji po SVM i uczenie bez nadzoru.
      - tytul: "MIT 6.S191: Introduction to Deep Learning"
        autor: Alexander Amini, Ava Amini · MIT
        link: https://introtodeeplearning.com/
        opis: Wykłady i laby w Colabie, od podstaw po modele generatywne i LLM-y.
      - tytul: "Neural Networks: Zero to Hero"
        autor: Andrej Karpathy
        link: https://karpathy.ai/zero-to-hero.html
        opis: Piszesz od zera autograd, model językowy i małego GPT.
      - tytul: A Recipe for Training Neural Networks
        autor: Andrej Karpathy
        link: https://karpathy.github.io/2019/04/25/recipe/
        opis: Krótki esej o tym, jak trenować sieć i wyłapywać ciche błędy.

  - id: ai
    nazwa: AI
    opis: Jak budować aplikacje na gotowych modelach językowych.
    materialy:
      - tytul: Building with the Claude API
        autor: Anthropic Academy
        link: https://academy.claude.com/courses/building-with-the-claude-api
        opis: Tool use, RAG, MCP i agenty, z kodem w Pythonie. Do ćwiczeń potrzebny jest klucz API.
      - tytul: Introduction to Agent Skills
        autor: Anthropic Academy
        link: https://academy.claude.com/courses/introduction-to-agent-skills
        opis: Jak tworzyć skille dla agentów.
      - tytul: Introduction to Model Context Protocol
        autor: Anthropic Academy
        link: https://academy.claude.com/courses/introduction-to-model-context-protocol
        opis: Jak podłączyć model do narzędzi i danych.
      - tytul: Introduction to evals
        autor: Anthropic Academy
        link: https://academy.claude.com/courses/introduction-to-evals
        opis: Jak sprawdzić, czy aplikacja na LLM-ie naprawdę działa.
      - tytul: Deep Dive into LLMs like ChatGPT
        autor: Andrej Karpathy
        link: https://www.youtube.com/watch?v=7xTGNNLPyMI
        opis: Jak powstaje model taki jak ChatGPT i skąd biorą się jego błędy.

  - id: ksiazki
    nazwa: Książki
    materialy:
      - tytul: Probably Overthinking It
        autor: Allen B. Downey
        link: https://www.goodreads.com/book/show/123226972-probably-overthinking-it
        opis: Statystyka i paradoksy w danych, na prawdziwych przykładach.
      - tytul: Bernoulli's Fallacy
        autor: Aubrey Clayton
        link: https://www.goodreads.com/book/show/55825328-bernoulli-s-fallacy
        opis: Krytyka statystyki częstościowej i argumenty za podejściem bayesowskim.
      - tytul: Szum
        autor: Daniel Kahneman, Olivier Sibony, Cass R. Sunstein
        link: https://lubimyczytac.pl/ksiazka/5016849/szum-czyli-skad-sie-biora-bledy-w-naszych-decyzjach
        opis: Szum a obciążenie w ludzkich osądach, czyli wariancja i bias poza ML-em.
      - tytul: Zwiedzeni przez przypadek
        autor: Nassim Nicholas Taleb
        link: https://lubimyczytac.pl/ksiazka/4930427/zwiedzeni-przez-przypadek-tajemnicza-rola-losowosci-w-zyciu-i-w-rynkowej-grze
        opis: Jak mylimy szczęście z umiejętnościami, m.in. przez błąd przeżywalności.
      - tytul: Thinking in Bets
        autor: Annie Duke
        link: https://www.goodreads.com/book/show/35957157-thinking-in-bets
        opis: Decyzje w warunkach niepewności oczami zawodowej pokerzystki. Dobra decyzja to nie to samo co dobry wynik.
      - tytul: An Introduction to Statistical Learning with Applications in Python
        autor: James, Witten, Hastie, Tibshirani, Taylor
        link: https://www.statlearning.com/
        opis: Klasyczny podręcznik ML od strony statystyki, z labami w Pythonie. Darmowy PDF.

  - id: zrodla
    nazwa: Źródła
    opis: Blogi i serwisy, z których warto czerpać na bieżąco.
    materialy:
      - tytul: Hacker News
        autor: Y Combinator
        link: https://news.ycombinator.com/
        opis: Szerszy kontekst branży tech. Czytaj selektywnie, bo łatwo stracić tu dużo czasu.
      - tytul: Andrej Karpathy
        autor: Blog
        link: https://karpathy.bearblog.dev/blog/
        opis: Eseje o LLM-ach i o tym, dokąd zmierza AI, np. coroczne podsumowanie roku w LLM-ach.
      - tytul: Ahead of AI
        autor: Sebastian Raschka
        link: https://magazine.sebastianraschka.com/
        opis: Przystępne omówienia najważniejszych nowych prac badawczych i architektur LLM.
      - tytul: Simon Willison
        autor: Blog
        link: https://simonwillison.net/
        opis: Praktyczne testy nowych modeli i narzędzi, czyli jak faktycznie budować z LLM-ami.

na_agh:
  - nazwa: BIT AI Konkursy
    opis: >-
      Grupa w kole naukowym BIT, która startuje razem w konkursach ML. Nie trzeba być ekspertem,
      wystarczy przyjść na spotkanie.
    punkty:
      - wspólne starty w konkursach, od comiesięcznych Kaggle Playground po wyzwania branżowe i hackathony
      - prelekcje inżynierów z firm budujących systemy AI
      - coding challenge z firmą z branży HFT
      - konkursy przy międzynarodowych konferencjach naukowych, z szansą na zaprezentowanie tam rozwiązania
    link: https://discord.gg/eZUC6xtuk
    link_tekst: Discord BIT (kanał BIT AI)
  - nazwa: RL Reading Group
    opis: >-
      Regularne spotkania, na których omawiamy artykuły o uczeniu ze wzmocnieniem, ale też z bardziej
      standardowego ML. Spotkania są stacjonarne i transmitowane na Discordzie. Dobry sposób, żeby nauczyć się
      czytać prace naukowe.
    link: https://discord.com/invite/AvVnKvf2w
    link_tekst: Discord RLRG
