# Materiały dodatkowe przypisane do rozdziałów skryptu (identyfikatory z rozdzialy.yml).
#
# `zrodla` to książki opisane raz (`skrot` to nazwa wyświetlana przy rozdziale, pełny tytuł
# pokazuje się w podpowiedzi); w rozdziale odwołujemy się do nich przez
# `{ zrodlo: <id>, gdzie: "<podrozdziały książki>" }`, opcjonalnie z `link` do konkretnej części.
# Pozostałe pozycje to `{ typ, tytul, autor, link }`. `podrozdzial` wskazuje miejsce w skrypcie,
# `opis` to jedno zdanie, dlaczego warto. Linkujemy tylko do legalnie udostępnionych wersji.
#
# Typy: ksiazka, wideo, artykul, notatki.

zrodla:
  tsun:
    skrot: Tsun
    tytul: Probability & Statistics with Applications to Computing
    autor: Alex Tsun
    link: https://www.alextsun.com/files/Prob_Stat_for_CS_Book.pdf
  ross:
    skrot: Ross
    tytul: A First Course in Probability (wyd. 10)
    autor: Sheldon M. Ross
  think-bayes:
    skrot: Think Bayes
    tytul: Think Bayes
    autor: Allen B. Downey
    link: https://allendowney.github.io/ThinkBayes2/
  islp:
    skrot: ISLP
    tytul: An Introduction to Statistical Learning (with Applications in Python)
    autor: G. James, D. Witten, T. Hastie, R. Tibshirani, J. Taylor
    link: https://www.statlearning.com/
  kolmogorov:
    skrot: Kołmogorow
    tytul: Foundations of the Theory of Probability (wyd. ang. 1950)
    autor: A. N. Kołmogorow
    link: https://archive.org/details/foundationsofthe00kolm

rozdzialy:
  descriptive:
    - typ: artykul
      tytul: "Same Stats, Different Graphs (Datasaurus)"
      autor: J. Matejka, G. Fitzmaurice (Autodesk Research)
      link: https://www.research.autodesk.com/publications/same-stats-different-graphs/
      podrozdzial: "1.3–1.4"
      opis: Zbiory danych o identycznych wskaźnikach liczbowych, które na wykresie wyglądają zupełnie inaczej.
    - typ: artykul
      tytul: I’ve Stopped Using Box Plots. Should You?
      autor: Nightingale
      link: https://nightingaledvs.com/ive-stopped-using-box-plots-should-you/
      podrozdzial: "1.4.2"
      opis: Czego wykres pudełkowy nie pokazuje i czym go zastąpić.

  calculus/probability:
    - { zrodlo: tsun, gdzie: "1.1–1.3, 2.1" }
    - { zrodlo: ross, gdzie: "2.2–2.5" }
    - { zrodlo: kolmogorov, opis: "Najciekawsze są pierwsze strony, na których Kołmogorow wprowadza aksjomatykę." }
    - typ: wideo
      tytul: "Dwa sygnały i jeden odbiornik (Zad. 2.13)"
      autor: 3Prompty1Film
      link: https://www.youtube.com/watch?v=KpGple9L1uw
      podrozdzial: "zad. 2.13"
      opis: "Prawdopodobieństwo geometryczne krok po kroku: kiedy dwa losowe sygnały psują odbiornik?"
    - typ: wideo
      tytul: "Lecture 1: Probability Models and Axioms"
      autor: MIT OpenCourseWare (6.041)
      link: https://www.youtube.com/watch?v=j9WZyLZCBzs
    - typ: wideo
      tytul: Why “probability of 0” does not mean “impossible”
      autor: 3Blue1Brown
      link: https://www.youtube.com/watch?v=ZA4JkHKZM50
      podrozdzial: "2.4"
      opis: Jak działa prawdopodobieństwo w zbiorach, które nie są dyskretne.

  calculus/conditional-independence:
    - { zrodlo: tsun, gdzie: "2.2.1, 2.3" }
    - { zrodlo: ross, gdzie: "3.2, 3.4–3.5" }
    - typ: wideo
      tytul: "Prawdopodobieństwo warunkowe (Def. 3.1)"
      autor: 3Prompty1Film
      link: https://www.youtube.com/watch?v=ddeJJGCsHI8
      podrozdzial: "3.1"
      opis: "Poker, all-in i czwarta karta: jak nowa informacja zmienia szanse."
    - typ: wideo
      tytul: "Niezależność zdarzeń (Def. 3.2)"
      autor: 3Prompty1Film
      link: https://www.youtube.com/watch?v=sRAIC-UVkbE
      podrozdzial: "3.2"
      opis: "Karty i kostki: kiedy prawdopodobieństwa się mnożą i czemu zdarzenia rozłączne są zależne."
    - typ: wideo
      tytul: "Lecture 2: Conditioning and Bayes' Rule"
      autor: MIT OpenCourseWare (6.041)
      link: https://www.youtube.com/watch?v=TluTv5V0RmE
    - typ: wideo
      tytul: "Lecture 3: Independence"
      autor: MIT OpenCourseWare (6.041)
      link: https://www.youtube.com/watch?v=19Ql_Q3l0GA
    - typ: wideo
      tytul: "Probabilistic ML, Lecture 2: Reasoning Under Uncertainty"
      autor: Tübingen Machine Learning
      link: https://www.youtube.com/watch?v=Mgi3oLAbu8Q&t=772s
      opis: Od 12:52 — ciekawe przykłady i wyjaśnienie, czym są zdarzenia niezależne.

  calculus/bayes:
    - { zrodlo: tsun, gdzie: "2.2.2–2.2.4" }
    - { zrodlo: ross, gdzie: "3.3" }
    - { zrodlo: think-bayes, gdzie: "rozdz. 2 Bayes's Theorem", podrozdzial: "4.1–4.2",
        link: "https://allendowney.github.io/ThinkBayes2/chap02.html",
        opis: "Problem ciasteczek, tabele bayesowskie, Monty Hall i zadania." }
    - typ: wideo
      tytul: "Bayes' theorem, the geometry of changing beliefs"
      autor: 3Blue1Brown
      link: https://www.3blue1brown.com/lessons/bayes-theorem
    - typ: wideo
      tytul: "The quick proof of Bayes' theorem"
      autor: 3Blue1Brown
      link: https://www.youtube.com/watch?v=U_85TaXbeIo
    - typ: wideo
      tytul: The Bayesian Trap
      autor: Veritasium
      link: https://www.youtube.com/watch?v=R13BD8qKeTg

  rv/general:
    - { zrodlo: tsun, gdzie: "3.1" }
    - { zrodlo: ross, gdzie: "4.1" }
    - typ: notatki
      tytul: Probabilities and Statistics refresher (CS 229)
      autor: Afshine i Shervine Amidi (Stanford)
      link: https://stanford.edu/~shervine/teaching/cs-229/refresher-probabilities-statistics
      opis: Zwięzła ściąga z wizualizacjami; obejmuje całe zmienne losowe jednowymiarowe (rozdziały 5–9).

  rv/real/distributions:
    - { zrodlo: tsun, gdzie: "3.1, 4.1" }
    - { zrodlo: ross, gdzie: "4.2, 4.10, 5.1" }

  rv/real/moments:
    - { zrodlo: tsun, gdzie: "3.2–3.3" }
    - { zrodlo: ross, gdzie: "4.3–4.5, 5.2" }

  rv/real/well-known:
    - { zrodlo: tsun, gdzie: "3.4–3.6, 4.2–4.3" }
    - { zrodlo: ross, gdzie: "4.6–4.8, 5.3–5.6" }
    - typ: artykul
      tytul: 68–95–99.7 rule
      autor: Wikipedia
      link: https://en.wikipedia.org/wiki/68%E2%80%9395%E2%80%9399.7_rule
      podrozdzial: "8.2.5"
    - typ: artykul
      tytul: Why are Normal Distributions Normal?
      autor: Aidan Lyon (Brit. J. Phil. Sci., 2014)
      link: https://aidanlyon.com/normal_distributions.pdf
      podrozdzial: "8.2.5"
      opis: Skąd rozkład normalny bierze się w przyrodzie — i kiedy to wyjaśnienie zawodzi.

  rv/real/functions:
    - { zrodlo: tsun, gdzie: "4.4" }
    - { zrodlo: ross, gdzie: "5.7" }

  rv/vector/distributions:
    - { zrodlo: tsun, gdzie: "5.1–5.2" }
    - { zrodlo: ross, gdzie: "6.1" }

  rv/vector/independence-cond:
    - { zrodlo: tsun, gdzie: "5.3, 9.3 (naiwny klasyfikator bayesowski)" }
    - { zrodlo: ross, gdzie: "6.2, 6.4–6.5" }
    - typ: wideo
      tytul: Naive Bayes, Clearly Explained!!!
      autor: StatQuest
      link: https://www.youtube.com/watch?v=O2L2Uv9pdDA
      podrozdzial: "11.5"

  rv/vector/moments:
    - { zrodlo: tsun, gdzie: "5.4" }
    - { zrodlo: ross, gdzie: "7.4" }

  rv/vector/well-known:
    - { zrodlo: tsun, gdzie: "5.8–5.9" }
    - { zrodlo: ross, gdzie: "7.8.1" }

  rv/vector/functions:
    - { zrodlo: tsun, gdzie: "5.5" }
    - { zrodlo: ross, gdzie: "6.3, 6.7" }

  rv/convergence:
    - { zrodlo: tsun, gdzie: "5.7, 6.1" }
    - { zrodlo: ross, gdzie: "8.2–8.3" }
    - typ: wideo
      tytul: But what is the Central Limit Theorem?
      autor: 3Blue1Brown
      link: https://www.youtube.com/watch?v=zeJD6dqJ5lo
      podrozdzial: "15.3"

  inference/estimators:
    - { zrodlo: tsun, gdzie: "7.1 Maximum Likelihood Estimation", podrozdzial: "17.7",
        link: "https://web.stanford.edu/class/archive/cs/cs109/cs109.1218/files/student_drive/7.1.pdf" }
    - { zrodlo: tsun, gdzie: "7.2 Maximum Likelihood Examples", podrozdzial: "17.7",
        link: "https://web.stanford.edu/class/archive/cs/cs109/cs109.1218/files/student_drive/7.2.pdf" }
    - { zrodlo: tsun, gdzie: "7.3 Method of Moments Estimation", podrozdzial: "17.8",
        link: "https://web.stanford.edu/class/archive/cs/cs109/cs109.1218/files/student_drive/7.3.pdf" }
    - { zrodlo: tsun, gdzie: "7.6–7.8 (własności estymatorów)" }
    - typ: wideo
      tytul: Maximum Likelihood, clearly explained!!!
      autor: StatQuest
      link: https://www.youtube.com/watch?v=XepXtl9YKwc
      podrozdzial: "17.7"

  inference/confint:
    - { zrodlo: tsun, gdzie: "8.1 Confidence Intervals",
        link: "https://web.stanford.edu/class/archive/cs/cs109/cs109.1218/files/student_drive/8.1.pdf" }
    - typ: wideo
      tytul: Confidence Intervals, Clearly Explained!!!
      autor: StatQuest
      link: https://www.youtube.com/watch?v=TqOeMYtOc1w

  inference/tests:
    - { zrodlo: tsun, gdzie: "8.3 Introduction to Hypothesis Testing",
        link: "https://web.stanford.edu/class/archive/cs/cs109/cs109.1218/files/student_drive/8.3.pdf" }
    - typ: artykul
      tytul: Lady tasting tea
      autor: Wikipedia
      link: https://en.wikipedia.org/wiki/Lady_tasting_tea
      opis: Eksperyment Fishera, od którego zaczyna się historia testowania hipotez.

  inference/regression:
    - { zrodlo: islp, gdzie: "rozdz. 3 Linear Regression", podrozdzial: "20.2–20.3" }

  mc/chains:
    - { zrodlo: ross, gdzie: "9.2" }
